name: Standalone policy and pinned source contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    name: policy (${{ matrix.standard }})
    strategy:
      fail-fast: false
      matrix:
        standard: [c++17, c++20]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run policy tests
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -Wall -Wextra -Werror -pedantic -Isrc \
            tests/PopulationPolicyTests.cpp -o /tmp/autonomy-policy-tests
          /tmp/autonomy-policy-tests
      - name: Compile and run enrollment lifecycle tests
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -Wall -Wextra -Werror -pedantic -Isrc \
            tests/EnrollmentStateTests.cpp -o /tmp/autonomy-enrollment-tests
          /tmp/autonomy-enrollment-tests
      - name: Compile and run cache and receipt tests
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          for test in EnrollmentCacheTests EnrollmentTransitionTests; do
            c++ -std="$CXX_STANDARD" -O2 -pthread -Wall -Wextra -Werror -pedantic -Isrc \
              tests/$test.cpp src/Persistence/EnrollmentTransition.cpp -o /tmp/autonomy-runtime-unit-tests
            /tmp/autonomy-runtime-unit-tests
          done
      - name: Test founding controller
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -pthread -Wall -Wextra -Werror -pedantic -Isrc tests/GuildDirectorTests.cpp src/Guild/GuildDirector.cpp -o /tmp/autonomy-guild-tests
          /tmp/autonomy-guild-tests
      - name: Test curated guild name pool
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -pthread -Wall -Wextra -Werror -pedantic -Isrc tests/GuildNameTests.cpp src/Guild/GuildDirector.cpp -o /tmp/autonomy-name-tests
          /tmp/autonomy-name-tests
      - name: Test roster and operation policies
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -O2 -pthread -Wall -Wextra -Werror -pedantic -Isrc \
            tests/OperationTests.cpp src/Operations/RosterPlanner.cpp src/Operations/OperationCoordinator.cpp \
            -o /tmp/autonomy-operation-tests
          /tmp/autonomy-operation-tests
      - name: Checkout versioned Classic pilot interface
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-dungeon-clear
          ref: fad8a7691197f5be922f00d6cd2d3430e68dc48c
          path: _deps/dungeon-clear
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Integration/DcAutonomyApi.h
            src/Integration/DcAutonomyPilot.h
      - name: Test real group executor and core adapter
        # Real group and core-adapter tests execute production code with fakes;
        # they neither configure nor build the game server.
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -O2 -pthread -Wall -Wextra -Werror -pedantic -Isrc \
            tests/RealGroupTests.cpp src/Operations/RosterPlanner.cpp src/Operations/OperationCoordinator.cpp \
            -o /tmp/autonomy-real-group-tests
          /tmp/autonomy-real-group-tests
          c++ -std="$CXX_STANDARD" -O2 -pthread -Wall -Wextra -Werror -pedantic -Itests/group_fakes -I_deps/dungeon-clear/src -Isrc \
            tests/CoreGroupPortTests.cpp src/Operations/CoreGroupPort.cpp \
            src/Operations/RosterPlanner.cpp src/Operations/OperationCoordinator.cpp \
            -o /tmp/autonomy-core-group-tests
          /tmp/autonomy-core-group-tests
          c++ -std="$CXX_STANDARD" -O2 -pthread -Wall -Wextra -Werror -pedantic -Itests/group_fakes -Isrc \
            tests/CoreGroupPortTests.cpp src/Operations/CoreGroupPort.cpp \
            src/Operations/RosterPlanner.cpp src/Operations/OperationCoordinator.cpp \
            -o /tmp/autonomy-core-group-missing-profile-tests
          /tmp/autonomy-core-group-missing-profile-tests
      - name: Test recruitment controller
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -pthread -Wall -Wextra -Werror -pedantic -Isrc tests/RecruitmentDirectorTests.cpp src/Guild/GuildDirector.cpp src/Guild/RecruitmentDirector.cpp -o /tmp/autonomy-recruit-tests
          /tmp/autonomy-recruit-tests
      - name: Verify missing-interface runtime stays dormant
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -pthread -Wall -Wextra -Werror -pedantic \
            -Itests/runtime_fakes -Isrc tests/EnrollmentRuntimeTests.cpp \
            src/Persistence/EnrollmentRuntime.cpp src/Persistence/EnrollmentTransition.cpp \
            -o /tmp/autonomy-no-provider-tests
          /tmp/autonomy-no-provider-tests
      - name: Checkout the pinned optional interface for controller boundary tests
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-playerbots
          ref: 696a009ceeeb400cfe40eedcd8a6c9333bdc1b59
          path: _deps/maintenance
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Bot/RoutineMaintenancePolicy.h
            src/Bot/AutonomyEnrollment.h
      - name: Exercise the real controller with deterministic engine and DB boundary fakes
        env:
          CXX_STANDARD: ${{ matrix.standard }}
        run: |
          c++ -std="$CXX_STANDARD" -pthread -Wall -Wextra -Werror -pedantic \
            -Itests/runtime_fakes -I_deps/maintenance/src/Bot -Isrc tests/EnrollmentRuntimeTests.cpp \
            src/Persistence/EnrollmentRuntime.cpp src/Persistence/EnrollmentTransition.cpp \
            -o /tmp/autonomy-controller-tests
          /tmp/autonomy-controller-tests
      - name: Test source contract checker
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate scaffold
        run: python3 tools/verify_scaffold.py

  mysql-transactions:
    runs-on: ubuntu-latest
    name: disposable MySQL ${{ matrix.mysql }} transactions (not a game-server test)
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4.10']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: autonomy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyMySQL==1.1.2
      - name: Checkout pinned core binary result decoder (no worldserver build)
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 0554bcdd664ff6d85291ca2a10fd31d3e37e89e6
          path: _deps/core
          persist-credentials: false
          sparse-checkout: |
            src/common
            src/server/game/Globals/ObjectMgr.cpp
            src/server/game/Globals/ObjectMgr.h
            src/server/game/World/World.h
            src/server/shared
            src/server/database
            deps/utf8cpp
            deps/fmt
            deps/SFMT
      - name: Checkout pinned maintenance interface
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-playerbots
          ref: 696a009ceeeb400cfe40eedcd8a6c9333bdc1b59
          path: _deps/playerbots
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Bot/RoutineMaintenancePolicy.h
            src/Bot/AutonomyEnrollment.h
      - name: Install isolated decoder test dependencies
        run: |
          sudo apt-get update
          # Hosted runners already include MySQL client development files.
          # Do not upgrade their local mysql-server alongside our service DB.
          if ! command -v mysql_config >/dev/null; then
            sudo apt-get install -y --no-install-recommends libmysqlclient-dev
          fi
          sudo apt-get install -y --no-install-recommends libboost-dev
      - name: Checkout matching owner trusted bridge interface
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-dungeon-clear
          ref: fad8a7691197f5be922f00d6cd2d3430e68dc48c
          path: _deps/dungeon-clear
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Integration/DcAutonomyApi.h
            src/Integration/DcAutonomyController.h
            src/Integration/DcAutonomyPilot.h
      - name: Execute production SQL against disposable fixtures
        env:
          AUTONOMY_MYSQL_HOST: 127.0.0.1
          AUTONOMY_MYSQL_DATABASE: autonomy_test
        run: python3 -m unittest discover -s tests -p 'test_*mysql.py' -v
      - name: Validate names using pinned actual core functions
        run: python3 tools/check_guild_names.py --core _deps/core
      - name: Exercise binary prepared stores and core decoder
        env:
          AUTONOMY_MYSQL_HOST: 127.0.0.1
          AUTONOMY_MYSQL_DATABASE: autonomy_test
        run: python3 tools/check_prepared_mysql.py --core _deps/core --playerbots _deps/playerbots --dungeon-clear _deps/dungeon-clear

  integration-contracts:
    runs-on: ubuntu-latest
    name: pinned external source-shape check (not a build)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Sparse public checkouts; pins are a reviewable contract snapshot,
      # NOT a claim of the exact dependency SHAs in the old homelab build.
      - name: Checkout playerbots core contract files
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 0554bcdd664ff6d85291ca2a10fd31d3e37e89e6
          path: _deps/core
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/cmake/ac_macros.cmake
            modules/CMakeLists.txt
            src/server/game/Scripting/ScriptDefines/WorldScript.h
            src/common/Configuration/Config.h
      - name: Checkout mod-playerbots contract file
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-playerbots
          ref: 696a009ceeeb400cfe40eedcd8a6c9333bdc1b59
          path: _deps/playerbots
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/Bot/RandomPlayerbotMgr.cpp
      - name: Checkout mod-dungeon-clear contract file
        uses: actions/checkout@v4
        with:
          repository: RovxBot/mod-dungeon-clear
          ref: fad8a7691197f5be922f00d6cd2d3430e68dc48c
          path: _deps/dungeon-clear
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/mod_dungeon_clear_loader.cpp
      - name: Verify boundary contracts without building the game
        run: |
          python3 tools/check_integration_contracts.py \
            --core _deps/core \
            --playerbots _deps/playerbots \
            --dungeon-clear _deps/dungeon-clear \
            --autonomy .

# This CI is intentionally cheap. Full worldserver compilation and runtime
# registration are distinct manual release gates described in docs/INTEGRATION.md.
